apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-redis
  namespace: dev
  labels:
    app: user-service-redis
    env: dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service-redis

  template:
    metadata:
      labels:
        app: user-service-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis-port
              containerPort: 6379
          command: ["redis-server", "--save", "", "--appendonly", "no"]

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3