services:
  user-service-db:
    image: postgres:17-alpine
    container_name: user-service-db-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-user_service_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-user_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service-redis:
    image: redis:7-alpine
    container_name: user-service-redis-container
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      DB_HOST: user-service-db
      DB_PORT: 5432
      DB_NAME: user_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: user-service-redis
      REDIS_PORT: 6379
    depends_on:
      user-service-db:
        condition: service_healthy
      user-service-redis:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
    name: microservices-net
    external: true