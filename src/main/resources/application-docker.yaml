spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:user-service-db}:5432/${DB_NAME:user_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:user-service-redis}
      port: ${REDIS_PORT:6379}