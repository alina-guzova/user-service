spring:
  application:
    name: user-service
  profiles:
    active: local

  datasource:
    hikari:
      connection-timeout: 5000

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

application:
  security:
    jwt:
      secret-key: 8ify9bC8hqNAE3Y/A4SatBDXR539wGPO3AEFMrXKQwAv8uxQmgB7rwCHLgN7c3Oe8mZbQ7s+/DhKizAqDRjkXw==

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    implicit-naming-strategy: org.springframework.boot.jpa.orm.hibernate.SpringImplicitNamingStrategy
    physical-naming-strategy: org.springframework.boot.jpa.orm.hibernate.CamelCaseToUnderscoresNamingStrategy

  jackson:
    time-zone: UTC

  cache:
    type: redis
    redis:
      time-to-live: 30m
      use-key-prefix: true
      cache-null-values: false

logging:
  pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) %clr(${PID:- }){magenta} --- [%15.15t] %clr(%-40.40logger{36}){cyan} [%X{traceId:-none}] : %m%n"
  level:
      root: INFO